version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - log_mood
  - suggest_coping_mechanisms
  - set_reminder
  - seek_support
  - ask_for_resources
  - save_data
  - ask_for_activities
  - ask_for_therapy
  - ask_for_symptoms
  - ask_for_mood_tracking
  - ask_for_loneliness_support
  - ask_for_anxiety_relief
  - ask_for_stress_relief
  - ask_for_depression_help
  - ask_for_guilt_relief
  - ask_for_mood_resources

 
entities:
  - mood
  - activity
  - time
  - resources

slots:
  mood:
    type: text
    mappings:
      - type: from_entity
        entity: mood

  activity:
    type: text
    mappings:
      - type: from_entity
        entity: activity

  time:
    type: text
    mappings:
      - type: from_entity
        entity: time

  resources:
    type: text
    mappings:
      - type: from_entity
        entity: resources

responses:
  utter_greet:
    - text: "Hey! How are you feeling today?"

  utter_cheer_up:
    - text: "Here is something to cheer you up:"
      image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
    - text: "Did that help you?"

  utter_happy:
    - text: "Great, carry on!"

  utter_goodbye:
    - text: "Goodbye! Take care of yourself."

  utter_iamabot:
    - text: "I am a bot, powered by Rasa."

  utter_log_mood:
    - text: "Got it! I've logged your mood as {mood}. Would you like some suggestions to feel better?"

  utter_suggest_coping_mechanisms:
    - text: "You could try a mindfulness exercise, some journaling, or even a short walk."

  utter_set_reminder:
    - text: "Alright! I'll remind you to {activity} at {time}."

  utter_seek_support:
    - text: "Here are some helpline numbers you can reach out to: [Example Helpline](tel:123-456-789)."

  utter_save_data:
    - text: "Your data has been saved successfully."

  utter_mood_resources:
    - text: "Here are some resources you may find helpful: [Mindfulness](https://www.mindful.org), [Therapist Locator](https://www.psychologytoday.com/therapists)"
  
  utter_ask_for_activities:
    - text: "You can try activities like going for a walk, reading a book, or doing some yoga."
 
  utter_ask_for_resources:
    - text: "Here are some links: [Mental Health Resources](https://www.mentalhealth.gov), [Crisis Helplines](https://www.crisistextline.org)"
    
  utter_anxiety_relief:
    - text: "For anxiety, try deep breathing exercises, meditation, or progressive muscle relaxation."

  utter_stress_relief:
    - text: "For stress relief, consider trying yoga, journaling, or simply taking a short walk outside."

  utter_depression_help:
    - text: "If you're feeling depressed, reaching out to a professional can help. You can also try activities that uplift you, such as engaging in hobbies or spending time with loved ones."

  utter_loneliness_support:
    - text: "Loneliness can be tough. Try reaching out to friends, family, or a counselor. Sometimes, joining a support group can help."

  utter_guilt_relief:
    - text: "Feeling guilty can be tough. Try self-compassion exercises, or consider talking to a therapist to process your feelings."

  utter_mood_tracking:
    - text: "It's helpful to track your mood over time. You can use a mood tracker or journal your emotions daily."

  utter_therapy_resources:
    - text: "Here are some resources for finding a therapist: [Therapist Locator](https://www.psychologytoday.com/therapists)."

  utter_symptom_resources:
    - text: "Here are some resources that can help you understand mental health symptoms: [Mental Health Symptoms](https://www.nami.org/learn-more/mental-health-conditions)."

actions:
  - action_log_mood
  - action_suggest_coping
  - action_set_reminder
  - action_save_data
  - action_ask_for_activities
  - action_ask_for_resources
  - action_mood_tracking
  - action_therapy_resources
  - action_symptom_resources
  - action_anxiety_relief
  - action_stress_relief
  - action_depression_help
  - action_loneliness_support
  - action_guilt_relief
  - action_anxiety_resources
  - action_find_therapy

  

session_config:
  session_expiration_time: 90
  carry_over_slots_to_new_session: true
