version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Respond to stress & memory question
  steps:
  - intent: ask_memory_stress
  - action: utter_memory_stress

- rule: Respond to financial stress question
  steps:
  - intent: ask_financial_stress
  - action: utter_financial_stress

- rule: Respond to social anxiety question
  steps:
  - intent: ask_social_anxiety
  - action: utter_social_anxiety






