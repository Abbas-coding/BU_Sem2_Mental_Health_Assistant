version: "3.1"

stories:

- story: happy path
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_great
  - action: utter_happy

- story: sad path 1
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: affirm
  - action: utter_happy

- story: sad path 2
  steps:
  - intent: greet
  - action: utter_greet
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_did_that_help
  - intent: deny
  - action: utter_goodbye

- story: log mood story
  steps:
  - intent: log_mood
  - action: action_log_mood
  - slot_was_set:
    - mood: "sad"
  - action: utter_suggest_coping_mechanisms

- story: set reminder story
  steps:
  - intent: set_reminder
  - action: action_set_reminder

- story: seek support story
  steps:
  - intent: seek_support
  - action: utter_seek_support

- story: suggest coping mechanisms
  steps:
  - intent: suggest_coping_mechanisms
  - action: action_suggest_coping

- story: Save data story
  steps:
  - intent: save_data
  - action: action_save_data
  - action: utter_happy

- story: happy mood conversation
  steps:
    - intent: greet
    - action: utter_greet
    - intent: log_mood
      entities:
        - mood: happy
    - action: utter_log_mood
    - intent: suggest_coping_mechanisms
    - action: utter_suggest_coping_mechanisms
    - intent: goodbye
    - action: utter_goodbye

- story: sad mood conversation
  steps:
    - intent: greet
    - action: utter_greet
    - intent: log_mood
      entities:
        - mood: sad
    - action: utter_log_mood
    - intent: suggest_coping_mechanisms
    - action: utter_suggest_coping_mechanisms
    - intent: save_data
    - action: action_save_data
    - action: utter_save_data
    - intent: goodbye
    - action: utter_goodbye

- story: activity suggestion
  steps:
    - intent: greet
    - action: utter_greet
    - intent: ask_for_activities
    - action: utter_ask_for_activities
    - intent: goodbye
    - action: utter_goodbye

- story: seek help and save data
  steps:
    - intent: greet
    - action: utter_greet
    - intent: seek_support
    - action: utter_seek_support
    - intent: save_data
    - action: action_save_data
    - action: utter_save_data
    - intent: goodbye
    - action: utter_goodbye

- story: Handle stress and memory concerns
  steps:
  - intent: ask_memory_stress
  - action: utter_memory_stress
  - intent: express_overwhelm
  - action: utter_acknowledge_stress
  - intent: mention_deadlines
  - action: utter_break_down_tasks
  - intent: mention_overthinking
  - action: utter_study_strategy
  - intent: express_relief
  - action: utter_encouragement

- story: Handle financial stress
  steps:
  - intent: ask_financial_stress
  - action: utter_financial_stress
  - intent: express_financial_worry
  - action: utter_financial_aid
  - intent: express_uncertainty
  - action: utter_focus_on_control
  - intent: express_lack_of_direction
  - action: utter_start_with_options
  - intent: express_stuck
  - action: utter_reassure_not_alone
  - intent: express_willingness_to_try
  - action: utter_financial_encouragement

- story: Handle social anxiety
  steps:
  - intent: ask_social_anxiety
  - action: utter_social_anxiety
  - intent: express_loneliness
  - action: utter_suggest_groups
  - intent: express_anxiety_meeting_people
  - action: utter_start_small
